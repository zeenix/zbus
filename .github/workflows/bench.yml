name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main" # or "master"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    # CodSpeed's macro runners (`runs-on: codspeed-macro`) give steadier walltime numbers than
    # the standard GitHub runners; switch to one once this project has access to them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed
      - name: Build the benchmark target(s)
        run: cargo codspeed build -m walltime --features zbus/p2p
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: cargo codspeed run -m walltime
          token: ${{ secrets.CODSPEED_TOKEN }} # optional for public repos