[package]
name = "zbus"
version = "6.0.0"
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
edition = { workspace = true }
rust-version = { workspace = true }

description = "API for D-Bus communication"
repository = { workspace = true }
keywords = ["D-Bus", "DBus", "IPC"]
license = { workspace = true }
categories = ["os::unix-apis"]
readme = "README.md"

[features]
default = ["async-io", "blocking-api"]
# Wire-format optional impls.
arrayvec = ["dep:arrayvec"]
camino = ["dep:camino"]
chrono = ["dep:chrono"]
# The `enumflags2` crate itself is a hard dependency: the message header stores its flags in a
# `BitFlags` field and needs the `Type` impl this feature gates, so every runtime feature
# switches it on.
enumflags2 = []
heapless = ["dep:heapless"]
# Enables ser/de of `Option<T>` as an array of 0 or 1 elements.
option-as-array = []
serde_bytes = ["dep:serde_bytes"]
time = ["dep:time"]
url = ["dep:url"]
# The `uuid` crate itself is a hard dependency (GUID generation); this feature only adds the
# wire-format impls for `uuid::Uuid`.
uuid = []
# Enables API that is only needed for bus implementations (enables `p2p`).
bus-impl = ["p2p"]
# Enables API that is only needed for peer-to-peer (p2p) connections.
p2p = ["uuid/v4"]
async-io = [
    "enumflags2",
    "dep:async-io",
    "async-executor",
    "async-fs",
    "async-task",
    "async-lock",
    # FIXME: We only currently only need this for unix but Cargo doesn't provide a way to enable
    # features for only specific target OS: https://github.com/rust-lang/cargo/issues/1197.
    "async-process",
    "blocking",
]
tokio = ["enumflags2", "dep:tokio"]
vsock = ["dep:vsock", "async-io"]
tokio-vsock = ["dep:tokio-vsock", "tokio"]
# Enable blocking API (default).
blocking-api = ["zbus_macros/blocking-api"]
# Dummy features to satisfy `cargo semver`. Should be removed at the next major version bump.
async-fs = []

[dependencies]
zbus_macros = { path = "../zbus_macros", version = "6.0.0" }
zvariant_derive = { path = "../zvariant_derive", version = "5.15.0" }
zcheapstr.workspace = true
endi.workspace = true
zvariant_utils = { path = "../zvariant_utils", version = "4.3.0" }

serde.workspace = true
serde_repr.workspace = true
enumflags2.workspace = true
futures-core.workspace = true
futures-lite.workspace = true
async-broadcast.workspace = true
hex.workspace = true
ordered-stream.workspace = true
uuid.workspace = true
event-listener.workspace = true
async-trait.workspace = true
tracing.workspace = true
winnow.workspace = true

# Optional and target-specific dependencies.
arrayvec = { workspace = true, optional = true }
camino = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
time = { workspace = true, optional = true }
url = { workspace = true, optional = true }
async-io = { workspace = true, optional = true }
async-lock = { workspace = true, optional = true }
async-executor = { workspace = true, optional = true }
blocking = { workspace = true, optional = true }
async-task = { workspace = true, optional = true }
async-process = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "fs",
    "io-util",
    # FIXME: We should only enable this feature for unix. See comment above regarding `async-process`
    # on why we can't.
    "process",
    "sync",
    "tracing",
] }

[target.'cfg(target_os = "linux")'.dependencies]
vsock = { workspace = true, optional = true }
tokio-vsock = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
uds_windows.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
libc.workspace = true
async-recursion.workspace = true

[target.'cfg(windows)'.dependencies.async-recursion]
workspace = true

[dev-dependencies]
zbus_xml.workspace = true

doc-comment.workspace = true
futures-util = { workspace = true, features = [
    "io",
    "async-await-macro",
    "async-await",
] }
ntest.workspace = true
test-log.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
    "net",
    "sync",
    "time",
    "test-util",
] }
tracing-subscriber.workspace = true
tempfile.workspace = true
criterion.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = [
    "serde",
    "alloc",
], default-features = false }

[package.metadata.docs.rs]
# we can't use:
# all-features = true
# because some features (such as vsock) are target-specific
features = [
    "arrayvec",
    "async-io",
    "blocking-api",
    "enumflags2",
    "uuid",
    "url",
    "time",
    "chrono",
    "heapless",
    "option-as-array",
    "camino",
    "bus-impl",
    "p2p",
    "tokio",
    "serde_bytes",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
    "aarch64-linux-android",
]

[lints]
workspace = true

[lib]
bench = false

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "concurrent_method_calls"
harness = false
required-features = ["p2p"]

[[bench]]
name = "names"
harness = false

[[bench]]
name = "wire"
harness = false

[[example]]
name = "screen-brightness"
path = "examples/screen-brightness.rs"
required-features = ["blocking-api"]
