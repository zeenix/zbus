[package]
name = "zbus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.7"
endi = "1.1.0"
serde = "1.0.229"

[dependencies.zbus]
path = ".."
default-features = false
# The D-Bus API, for the `header` target to decode messages with, and the bus API, for the `body`
# target to check bodies with.
features = ["comms", "bus-impl"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "dbus"
path = "fuzz_targets/dbus.rs"
test = false
doc = false

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false

[[bin]]
name = "body"
path = "fuzz_targets/body.rs"
test = false
doc = false
